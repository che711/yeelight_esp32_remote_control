; Пульт для лампы Yeelight Screen Light Bar Pro на Waveshare ESP32-C6-Zero
; Для ESP32-C6 нужна платформа pioarduino (в официальной платформе Arduino для C6 нет)

[env:esp32-c6-zero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Serial через встроенный USB-порт платы
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
